[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=src/app --cov-report=term-missing --cov-report=xml
asyncio_mode = auto

markers =
    unit: unit tests (SQLite)
    integration: integration tests (Postgres + Redis)
    slow: slow tests (docker required)

asyncio_default_fixture_loop_scope = function

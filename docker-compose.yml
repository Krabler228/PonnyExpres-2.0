version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parcel-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      poetry run uvicorn src.app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: parcel-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: parcel-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
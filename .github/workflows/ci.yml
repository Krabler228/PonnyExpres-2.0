name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-22.04

    env:
      PYTHONPATH: "./src"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev --no-root

      - name: Lint with Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run tests
        run: |
          poetry run pytest
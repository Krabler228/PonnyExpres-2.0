name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ponny_test
          POSTGRES_USER: ponny_user
          POSTGRES_PASSWORD: ponny_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev --no-root

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://ponny_user:ponny_pass@localhost:5432/ponny_test
          ALEMBIC_DATABASE_URL: postgresql+psycopg://ponny_user:ponny_pass@localhost:5432/ponny_test
          TEST_DATABASE_URL: postgresql+asyncpg://ponny_user:ponny_pass@localhost:5432/ponny_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ponny_test
          POSTGRES_USER: ponny_user
          POSTGRES_PASSWORD: ponny_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          poetry run alembic upgrade head

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ponny_user:ponny_pass@localhost:5432/ponny_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ponny_test
          POSTGRES_USER: ponny_user
          POSTGRES_PASSWORD: ponny_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          poetry run pytest -v --cov=src/app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4

      - name: Lint with Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .